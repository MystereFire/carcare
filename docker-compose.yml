services:
  carcare:
    build:
      context: .
      args:
        VITE_GOOGLE_AUTH_ENABLED: ${VITE_GOOGLE_AUTH_ENABLED:-false}
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans le fichier .env}
      DATABASE_URL: ${DATABASE_URL:-}
      SQLITE_PATH: ${SQLITE_PATH:-/app/data/carcare.sqlite}
      API_URL: ${API_URL:-http://localhost:${PORT:-5000}}
      FRONTEND_URL: ${FRONTEND_URL:-${API_URL:-http://localhost:${PORT:-5000}}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
